[package]
name = "pgd-editor"
version = "0.1.0"
description = "Editor de planes de gestión de datos"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pgd_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
